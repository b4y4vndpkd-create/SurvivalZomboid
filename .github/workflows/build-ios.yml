name: Build iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot and Export Templates
        run: |
          GODOT_VERSION=4.3-stable
          
          # Download and install Godot Editor
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip godot.zip
          sudo mv Godot.app /Applications/Godot.app
          sudo ln -s /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot

          # Download Export Templates .tpz file
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          
          # Let Godot install the templates automatically into the correct path
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}
          godot --headless --install-export-templates templates.tpz || true
          
          # Fallback manual placement just in case
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}
          unzip -o templates.tpz -d template_extracted
          find template_extracted -name "ios.zip" -exec cp {} ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}/ \;

      - name: Export iOS Project
        run: |
          cd survival_zomboid
          mkdir -p build/ios
          godot --headless --path . --export-release "iOS" build/ios/game.xcodeproj
