name: Build iOS

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          brew install --cask godot
          godot --version

      - name: Export iOS Project
        run: |
          cd survival_zomboid
          mkdir -p build/ios
          godot --headless --export-release "iOS" build/ios/game.xcodeproj
